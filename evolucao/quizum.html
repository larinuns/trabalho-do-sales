<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz - evolução</title>
    <link rel="shortcut icon" href="img/quiz.ico" type="image/x-icon">
    <link rel="stylesheet" href="quizum.css">
    <script src="quizum.js" defer></script>
</head>
<body>
    <header>
        <nav>
            <table>
                <tr>
                    <td>
                        <button onclick=window.location.reload()>Reiniciar</button>
                    </td>
                    <td>
                        <button onclick=window.location.reload()>Escolher outro quiz</button>
                    </td>
                </tr>
            </table>
        </nav>
    </header>
    
    <div class="JogoCompleto">

        <div class="Boas_vindas">
            <h1>Bem-vindo ao Quiz sobre Evolução</h1>
        </div>

        <div class="cadastro esconder">
            <label for="Nome">Nome do Jogador:</label>
            <input type="text" id="nome" required placeholder="Nome">
        </div>

        <div class="JogoQuiz esconder">
            <h1 class="pergunta">Pergunta</h1>
            <div class="opcoes">
              <button class="opcao">Opção 1</button>
              <button class="opcao">Opção 2</button>
              <button class="opcao">Opção 3</button>
              <button class="opcao">Opção 4</button>
            </div>
        </div>

        <div class="btn_seguir">
            <button class="entrar" onclick="EntrarNoJogo()">Entrar</button>
            <button class="btnCadastro esconder" onclick="ComecarJogar()">Começar a Jogar</button>
            <button class="proximo esconder" onclick="TrocarPergunta()">Próximo</button>
        </div>
    </div>
</body>
</html>
